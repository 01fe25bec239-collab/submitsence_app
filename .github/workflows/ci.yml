name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix backend
      - run: npm run typecheck --prefix backend
      # Deliberately not `npm test`: that script's plain *.test.ts glob also
      # matches the dedicated PostgreSQL suites (*.pg.test.ts), which throw
      # at module-load time when CI is set and their required database URL
      # is absent — as it always is in this job. test:application excludes
      # them explicitly; they run in their own steps in the database job
      # below, each with exactly the credential it needs.
      - run: npm run test:application --prefix backend
      # PB-10 Step 3 Phase 2d, HIGH 2 / final review, HIGH 1: a dedicated,
      # counted, name-asserted, PROVENANCE-BOUND gate for the client-ownership
      # boundary's unit contracts.
      #
      # The step above runs these files too, but only as part of a 350-test
      # aggregate whose totals say nothing about *which* cases ran: a lifecycle
      # scenario could be renamed, skipped or deleted outright and that step
      # would still go green. This one enforces the mandatory set explicitly —
      # zero failures, zero skips, an exact pass count, and every mandatory
      # scenario present by name — and it is deliberately distinct from (and
      # additional to) the real-PostgreSQL Phase 2d step in the database job
      # below, which proves the same contract against sessions handed to a real
      # next borrower.
      #
      # PROVENANCE (final review, HIGH 1). The previous shape of this gate ran
      # `npm run test:unit:phase2d` and asserted only the *aggregate* TAP
      # output. Node's test runner emits one flat, ungrouped stream for a
      # multi-file invocation, so nothing in that output tied a name or a count
      # to the file that produced it: the independent review pointed the npm
      # script at a single wholly unrelated file that merely declared the same
      # test names and the same total, and the gate passed. Aggregate evidence
      # is not provenance.
      #
      # The binding is now structural, in three parts:
      #
      #  1. The file list is an immutable literal *in this workflow*, not in
      #     backend/package.json. Redirecting the npm script can no longer
      #     change what this gate executes.
      #  2. Each required file is invoked on its own and its own totals are
      #     asserted, so every count is bound to the path that produced it. A
      #     different file cannot supply another file's passes, and a file that
      #     runs zero tests fails on its own count rather than being absorbed
      #     into a correct-looking total.
      #  3. Every mandatory scenario is required to appear in the log of the
      #     specific file that must contain it, so a name migrating between
      #     files — or into an unrelated one — fails closed.
      #
      # The developer-facing `test:unit:phase2d` script is additionally asserted
      # to name exactly the same files, so local runs and CI cannot drift; a
      # required file renamed without updating this gate fails on the missing
      # path before a single test runs.
      #
      # Nothing here prints a credential or a database URL: neither suite
      # connects to a database at all.
      #
      # Two of the mandatory scenarios (duplicate finalization from two
      # independent owners, and the refusal to reset while registered
      # client-owned work is unsettled) inherently need the second migration
      # connection an execution run holds, so they live in the execution
      # suite's own two-connection harness.
      - name: Enforce the Phase 2d client-ownership unit contracts
        run: |
          set -u -o pipefail
          fail() { echo "PHASE 2D GATE FAILED: $*" >&2; exit 1; }

          # (1) The immutable file list, and the structural assertion that the
          # developer-facing script names exactly it.
          expected_script='node --import tsx --test test/migration-session-reset.test.ts test/migration-execute.test.ts'
          actual_script=$(node -p 'require("./backend/package.json").scripts["test:unit:phase2d"] || ""')
          [ "$actual_script" = "$expected_script" ] \
            || fail "backend test:unit:phase2d is '$actual_script'; this gate requires '$expected_script'"

          cat > /tmp/pb10-phase2d-control.txt <<'CONTROL_SCENARIOS'
          a healthy client is reset in order and released, never destroyed
          an absent driver cache shape fails closed and destroys the client
          an unexpected driver cache shape fails closed and destroys the client
          an unprovable driver cache clear fails closed and destroys the client
          a client checked out again by a later run is disposed of again, not silently kept
          a failed reset statement destroys the client
          a reset that never answers is abandoned on its budget, and the client is destroyed
          connection loss during the reset destroys the client and raises no unhandled rejection
          a failed ROLLBACK destroys the client rather than resetting or returning it
          no normal release ever follows a destructive release
          invalid plan lock options are rejected before any client is acquired, and never leak one
          a lock option that can only fail after acquisition still reaches exactly one terminal disposition
          a control client whose error-listener registration always throws still reaches exactly one terminal disposition
          primary and cleanup failures compose: the migration's own error is never replaced by a cleanup error
          a reset-success baseline is verified, not assumed: a proof returning no row at all is refused
          a reset that succeeds but leaves the session dirty is still refused
          cleanup failure never replaces a primary execution failure
          the control client's own reset runs after the advisory unlock, never before it
          an owner that already knows the session is unusable destroys it without issuing any reset
          the disposer is reachable only through an approved entry point, never as a module export
          phase2d: a control listener throwing a null-prototype object with no primitive conversion at all still reaches exactly one terminal disposition
          phase2d: a control listener throwing an object whose Symbol.toPrimitive throws still reaches exactly one terminal disposition
          phase2d: a control listener throwing a null-prototype object whose own toString and valueOf both throw still reaches exactly one terminal disposition
          phase2d: a control listener throwing a Proxy whose getPrototypeOf trap throws, defeating the instanceof probe itself still reaches exactly one terminal disposition
          phase2d: a control listener throwing a revoked Proxy, where every operation but typeof throws still reaches exactly one terminal disposition
          phase2d: a hostile primary throw value composes deterministically with an ordinary cleanup failure
          phase2d: an ordinary primary failure survives a hostile cleanup throw value
          phase2d: a native newListener handler firing inside the control disposer cannot start a second disposition
          phase2d: the same client checked out by a later episode is still disposed of independently after a reentrant one
          CONTROL_SCENARIOS

          cat > /tmp/pb10-phase2d-execution.txt <<'EXECUTION_SCENARIOS'
          phase2d: duplicate finalization of one execution client is exactly once
          phase2d: no release while registered client-owned work remains unsettled
          a synchronous throw while installing the execution client's 'error' listener still yields exactly one terminal disposition
          an execution client whose error-listener registration always throws still reaches exactly one terminal disposition
          a failure removing the control listener never skips the execution client's terminal disposition
          a control-listener removal failure is composed with a primary migration failure, never in place of it
          an execution-client release failure is composed with a primary migration failure, never in place of it
          per-episode lifecycle bookkeeping that fails synchronously still yields exactly one disposition per client
          production build exposes exactly the approved public surface, and no other migrate module provides an alternate entry point
          phase2d: an execution listener throwing a null-prototype object with no primitive conversion at all still reaches exactly one terminal disposition
          phase2d: an execution listener throwing an object whose Symbol.toPrimitive throws still reaches exactly one terminal disposition
          phase2d: an execution listener throwing a null-prototype object whose own toString and valueOf both throw still reaches exactly one terminal disposition
          phase2d: an execution listener throwing a Proxy whose getPrototypeOf trap throws, defeating the instanceof probe itself still reaches exactly one terminal disposition
          phase2d: an execution listener throwing a revoked Proxy, where every operation but typeof throws still reaches exactly one terminal disposition
          phase2d: a hostile cleanup throw value never displaces a primary migration failure
          phase2d: a hostile throw from release() itself is still exactly one attempt, composed rather than raw
          phase2d: a native newListener handler firing inside the execution disposer cannot start a second disposition
          phase2d: repeated native newListener re-entry cannot accumulate terminal actions
          phase2d: re-entering disposal while the terminal reset is in flight joins the disposition already claimed
          phase2d: re-entering disposal from inside release() itself cannot produce a second terminal action
          phase2d: two concurrent disposition callers share one terminal action
          EXECUTION_SCENARIOS

          # (2)+(3) Per-file execution, per-file counts, per-file names. The
          # `file:passes:manifest` triples below are the gate's own record of
          # which suite owes which evidence.
          for required in \
            "test/migration-session-reset.test.ts:41:/tmp/pb10-phase2d-control.txt" \
            "test/migration-execute.test.ts:164:/tmp/pb10-phase2d-execution.txt"
          do
            file=${required%%:*}
            rest=${required#*:}
            passes=${rest%%:*}
            manifest=${rest#*:}
            [ -f "backend/$file" ] || fail "required Phase 2d test file is missing: $file"
            # A file that does not import the migration lifecycle module cannot
            # be exercising the boundary, whatever it declares its tests to be
            # called. This is what stops a same-name, same-count decoy from
            # standing in for a required suite.
            grep -q 'src/db/migrate/' "backend/$file" \
              || fail "$file does not import the migration lifecycle module it is supposed to exercise"
            log="/tmp/pb10-phase2d-$(basename "$file").log"
            ( cd backend && node --import tsx --test "$file" ) 2>&1 | tee "$log"
            grep -qx '# fail 0' "$log" || fail "$file reported a failing test"
            grep -qx '# skipped 0' "$log" || fail "$file skipped a test"
            grep -qx "# pass $passes" "$log" \
              || fail "$file did not report exactly $passes passing tests"
            while IFS= read -r scenario; do
              scenario=$(echo "$scenario" | sed -e 's/^[[:space:]]*//')
              [ -n "$scenario" ] || continue
              grep -qF -- "- $scenario" "$log" \
                || fail "$file is missing mandatory Phase 2d scenario: $scenario"
            done < "$manifest"
          done
      - run: npm run build --prefix backend
      - run: npm audit --prefix backend --omit=dev --audit-level=high
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run build --prefix web
      - run: npm audit --prefix web --omit=dev --audit-level=high

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: submitsense
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d submitsense"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Provisioning/teardown credential only (create/drop whole databases as
      # the postgres superuser). Deliberately job-scoped: it is not the
      # app-vs-migration credential pair that creates the cross-contamination
      # risk this job guards against, so every step needing to create or drop
      # a database may use it directly. TEST_DATABASE_URL and
      # MIGRATION_TEST_DATABASE_URL are NOT set here — each step below opts
      # into exactly the one(s) it needs, so a normal application/commercial
      # step can never see the migration-only credential and vice versa. The
      # two identity-guard steps are the sole, deliberate exception: their
      # entire job is to prove those two credentials name different physical
      # databases, which requires seeing both.
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/submitsense
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - name: Verify frozen previous-schema fixture integrity
        run: db/control/test-fixture-integrity.sh
      - name: Verify mr_metadata_ck CHECK-clause parity (fresh install vs. upgrade)
        run: db/control/test-check-clause-parity.sh
      - name: Provision isolated application and migration databases
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database application_test"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database migration_execution_test"
      - name: Test migration manifest contract
        run: node --import tsx --test test/migration-manifest.test.ts
        working-directory: backend
      - name: Check migration manifest
        run: npm run manifest:check --prefix backend
      - name: Check historical migration immutability
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags origin main:refs/remotes/origin/main
            MIGRATION_BASE="$(git merge-base HEAD origin/main)"
          else
            MIGRATION_BASE="$BEFORE_SHA"
          fi
          npm run manifest:history --prefix backend -- "$MIGRATION_BASE"
      - name: Apply every forward migration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        run: |
          for migration in db/migrations/0*.sql; do
            [[ "$migration" == *.down.sql ]] && continue
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run database guardrails
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        run: |
          for test_file in db/test/test*.sql; do
            [[ "$test_file" == "db/test/test_migration_control.sql" ]] && continue
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$test_file"
          done
      - name: Apply PB-10 migration control schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        # PB-10 Step 3 Phase 2c: the control schema installs a two-role model
        # and needs to be told which role the migration runner logs in as. The
        # file also fails closed if that role does not already exist, or if it
        # is a superuser, so the role is created first with no attributes.
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            do \$\$
            begin
              if pg_catalog.to_regrole('submitsense_migrate') is null then
                create role submitsense_migrate login password 'submitsense_migrate';
              end if;
            end
            \$\$;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v migration_execution_role=submitsense_migrate \
            -f db/control/control-schema.sql
          # PB-10 Step 3 Phase 2c final review, HIGH: the one database-level
          # privilege the migration execution role genuinely requires.
          # db/migrations/0001_extensions_helpers.sql issues
          # `create schema if not exists app`, and CREATE SCHEMA is authorized
          # by CREATE on the *database* — there is no narrower grant. Omitting
          # it is what made the canonical migration suite exit 1 under the
          # committed environment. It conveys nothing over migration_control
          # (owned by migration_control_owner) and does not make the role a
          # superuser; db/README.md documents it as a deployment prerequisite,
          # and migration-control-proof.pg.test.ts carries the negative control
          # proving the suite fails clearly when it is absent.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "grant create on database application_test to submitsense_migrate"
      - name: Verify control-schema re-application fails closed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        run: |
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v migration_execution_role=submitsense_migrate -f db/control/control-schema.sql; then
            echo "re-application unexpectedly succeeded"
            exit 1
          fi
          # Three now: the two Step-2 ledger tables plus the protected proof key.
          test "$(psql "$DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'migration_control' and c.relkind = 'r'")" = "3"
      - name: Verify control-schema upgrade from the previous PB-10 installation
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database control_schema_upgrade_test"
          UPGRADE_DB_URL="postgresql://postgres:postgres@localhost:5432/control_schema_upgrade_test"
          psql "$UPGRADE_DB_URL" -v ON_ERROR_STOP=1 -f db/control/fixtures/control-schema.pre-metadata-filename-ordinal.sql
          psql "$UPGRADE_DB_URL" -v ON_ERROR_STOP=1 -c "
            do \$\$
            begin
              if pg_catalog.to_regrole('submitsense_migrate') is null then
                create role submitsense_migrate login password 'submitsense_migrate';
              end if;
            end
            \$\$;"
          psql "$UPGRADE_DB_URL" -v ON_ERROR_STOP=1 -q \
            -c "insert into migration_control.schema_migrations (migration_id, ordinal, filename, manifest_checksum_sha256, applied_checksum_sha256, lifecycle_phase, operation_categories, execution_mode, applied_at, run_id, baselined, source_git_sha, executor_image_digest) values ('0001', 1, '0001_extensions_helpers.sql', repeat('a', 64), null, 'expand', array['schema'], 'legacy-verbatim', now(), gen_random_uuid(), true, '5324116250977b5e8ac24bc83b6cae89ebcbd990', 'sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08')" \
            -c "insert into migration_control.migration_runs (run_id, migration_id, event_sequence, event_type, metadata) values (gen_random_uuid(), '0001', 1, 'started', '{}'::jsonb)"
          before_rows="$(psql "$UPGRADE_DB_URL" -XAtq -c "select (select count(*) from migration_control.schema_migrations) || ':' || (select count(*) from migration_control.migration_runs)")"
          export MIGRATION_EXECUTION_ROLE=submitsense_migrate
          DATABASE_URL="$UPGRADE_DB_URL" db/control/install-or-upgrade-control-schema.sh
          DATABASE_URL="$UPGRADE_DB_URL" db/control/install-or-upgrade-control-schema.sh
          DATABASE_URL="$UPGRADE_DB_URL" db/control/install-or-upgrade-control-schema.sh
          after_rows="$(psql "$UPGRADE_DB_URL" -XAtq -c "select (select count(*) from migration_control.schema_migrations) || ':' || (select count(*) from migration_control.migration_runs)")"
          test "$before_rows" = "1:1"
          test "$after_rows" = "$before_rows"
          test "$(psql "$UPGRADE_DB_URL" -XAtq -c "select count(*) from pg_constraint where conrelid = 'migration_control.migration_runs'::regclass and conname = 'mr_metadata_ck'")" = "1"
          psql "$UPGRADE_DB_URL" -v ON_ERROR_STOP=1 -q -c "insert into migration_control.migration_runs (run_id, migration_id, event_sequence, event_type, metadata) values (gen_random_uuid(), '0001', 2, 'started', '{\"migration_filename\":\"0001_extensions_helpers.sql\",\"migration_ordinal\":1}'::jsonb)"
          if psql "$UPGRADE_DB_URL" -q -c "insert into migration_control.migration_runs (run_id, migration_id, event_sequence, event_type, metadata) values (gen_random_uuid(), '0001', 3, 'started', '{\"sql\":\"drop table x\"}'::jsonb)" 2>/tmp/upgrade-reject.err; then
            echo "invalid metadata unexpectedly accepted after upgrade"
            exit 1
          fi
          grep -q "mr_metadata_ck" /tmp/upgrade-reject.err
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop database control_schema_upgrade_test with (force)"
      - name: Verify install, upgrade, role model and fresh/upgraded parity
        # PB-10 Step 3 Phase 2c: the durable regression for the two paths the
        # review found diverging. Covers a fresh install, every fail-closed
        # install case, a genuine pre-Phase-2c installation owned by the
        # migration runner itself, three consecutive upgrades, one-for-one row
        # preservation, and a full catalog comparison of fresh vs upgraded.
        run: |
          ADMIN_DATABASE_URL="$ADMIN_DATABASE_URL" db/control/test-install-upgrade-parity.sh
      - name: Verify the upgrade resists search_path spoofing
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database search_path_spoof_test"
          MIGRATION_EXECUTION_ROLE=submitsense_migrate \
          PGDATABASE_URL="postgresql://postgres:postgres@localhost:5432/search_path_spoof_test" \
            db/control/test-hostile-search-path.sh
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop database search_path_spoof_test with (force)"
      - name: Test migrate.sh infrastructure-ledger insert is injection-safe
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "create database migrate_ledger_insert_test"
          PGHOST=localhost PGPORT=5432 PGDATABASE=migrate_ledger_insert_test PGUSER=postgres PGPASSWORD=postgres \
            infra/scripts/test-migrate-ledger-insert.sh
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop database migrate_ledger_insert_test with (force)"
      - name: Test migration control schema and advisory lock
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/test/test_migration_control.sql
      - name: Test commit-proof and transaction-binding contracts against real PostgreSQL
        env:
          # Both credentials: this suite reinstalls migration_control for every
          # case, so its before() runs the same distinct-database guard as
          # test:pg:migration before any destructive statement.
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_execution_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        # Counts asserted, not merely exit status: a suite that dies in
        # before(), or silently skips, must fail this step rather than quietly
        # removing the C1/C2 coverage it exists to provide.
        run: |
          set -o pipefail
          npm run test:pg:proof --prefix backend 2>&1 | tee /tmp/pg-proof.log
          grep -qx '# fail 0' /tmp/pg-proof.log
          grep -qx '# skipped 0' /tmp/pg-proof.log
          grep -qx '# pass 17' /tmp/pg-proof.log
      - name: Test H2 mode-specific safe recovery against real PostgreSQL
        env:
          # Both credentials: this suite reinstalls migration_control for every
          # case, so its before() runs the same distinct-database guard as
          # test:pg:migration before any destructive statement.
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_execution_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        # PB-10 Step 3 Phase 2c HIGH 2. Counts asserted, not merely exit
        # status: a suite that dies in before(), or silently skips, must fail
        # this step rather than quietly removing the two-stage recovery
        # coverage it exists to provide.
        run: |
          set -o pipefail
          npm run test:pg:h2-recovery --prefix backend 2>&1 | tee /tmp/pg-h2.log
          grep -qx '# fail 0' /tmp/pg-h2.log
          grep -qx '# skipped 0' /tmp/pg-h2.log
          grep -qx '# pass 22' /tmp/pg-h2.log
      - name: Test pooled session reset and safe connection return against real PostgreSQL
        env:
          # Both credentials: this suite reinstalls migration_control for every
          # case, so its before() runs the same distinct-database guard as
          # test:pg:migration before any destructive statement.
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_execution_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        # PB-10 Step 3 Phase 2d. Counts asserted, not merely exit status: every
        # case here is a claim about what the *next borrower* of a pooled
        # connection receives, and a suite that dies in before() or silently
        # skips would remove that coverage while the step still went green.
        run: |
          set -o pipefail
          npm run test:pg:session-reset --prefix backend 2>&1 | tee /tmp/pg-session-reset.log
          grep -qx '# fail 0' /tmp/pg-session-reset.log
          grep -qx '# skipped 0' /tmp/pg-session-reset.log
          grep -qx '# pass 18' /tmp/pg-session-reset.log
      - name: Test read-only migration plan
        # Pure unit test of runner.ts's plan-building logic; no database
        # credential of any kind reaches this step.
        run: node --import tsx --test test/migration-runner.test.ts
        working-directory: backend
      - name: Verify real migration plan is read-only
        env:
          # PB-10 Step 3 Phase 2c: the plan connects as the *migration
          # execution role*, not as the superuser. runner.ts refuses a
          # superuser connection outright — a superuser bypasses every
          # privilege the commit-proof design relies on — so running this step
          # with the admin credential would fail closed by design and would
          # also prove nothing about the role migrations actually run as.
          DATABASE_URL: postgresql://submitsense_migrate:submitsense_migrate@localhost:5432/application_test
          ADMIN_PLAN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        run: |
          before="$(psql "$ADMIN_PLAN_DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "select (select count(*) from migration_control.schema_migrations) || ':' || (select count(*) from migration_control.migration_runs)")"
          npm run --silent migrate:plan --prefix backend > /tmp/migration-plan.json
          after="$(psql "$ADMIN_PLAN_DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "select (select count(*) from migration_control.schema_migrations) || ':' || (select count(*) from migration_control.migration_runs)")"
          test "$before" = "0:0"
          test "$after" = "$before"
          node -e 'const plan = require("/tmp/migration-plan.json"); if (plan.pendingCount !== 24) process.exit(1)'
      - name: Verify plan fails closed on legacy ledger divergence
        env:
          # As above: the plan runs as the migration execution role.
          DATABASE_URL: postgresql://submitsense_migrate:submitsense_migrate@localhost:5432/application_test
          ADMIN_PLAN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        run: |
          psql "$ADMIN_PLAN_DATABASE_URL" -v ON_ERROR_STOP=1 -q \
            -c "create table public.infrastructure_schema_migrations (filename text primary key, applied_at timestamptz not null default now())" \
            -c "insert into public.infrastructure_schema_migrations(filename) values ('0001_extensions_helpers.sql')" \
            -c "grant select on public.infrastructure_schema_migrations to submitsense_migrate"
          if npm run --silent migrate:plan --prefix backend > /tmp/divergence.json 2>/tmp/divergence.err; then
            echo "plan unexpectedly succeeded against an unbaselined legacy ledger"
            exit 1
          fi
          grep -q "Legacy migration ledger public.infrastructure_schema_migrations" /tmp/divergence.err
          test "$(psql "$ADMIN_PLAN_DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "select (select count(*) from migration_control.schema_migrations) || ':' || (select count(*) from public.infrastructure_schema_migrations)")" = "0:1"
          psql "$ADMIN_PLAN_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c "drop table public.infrastructure_schema_migrations"
      - name: Test migration execution modes
        # Pure unit test of execute.ts against an in-memory fake pool; no
        # database credential of any kind reaches this step.
        run: node --import tsx --test test/migration-execute.test.ts
        working-directory: backend
      - name: Test H1 ERROR_CLASSES runtime and declaration compatibility
        # PB-10 Step 3 Phase 2c HIGH 1. Pure unit test, including against the
        # emitted execute.d.ts; no database credential reaches this step.
        # Counted, so a suite that silently stops running fails CI.
        run: |
          set -o pipefail
          node --import tsx --test test/migration-error-class-compatibility.test.ts 2>&1 | tee /tmp/h1.log
          grep -qx '# fail 0' /tmp/h1.log
          grep -qx '# skipped 0' /tmp/h1.log
          grep -qx '# pass 3' /tmp/h1.log
        working-directory: backend
      - name: Test migration execution against real PostgreSQL
        env:
          # Both credentials, deliberately: this suite's own before() runs
          # the application/migration database-identity guard (see
          # database-identity.ts) as the very first thing, before it opens
          # any connection or issues any destructive statement, and that
          # guard must be able to see both databases to prove they differ.
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_execution_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        run: npm run test:pg:migration --prefix backend
      - name: Test cancellation-confirmation hardening against real PostgreSQL
        env:
          # Both credentials, deliberately: this suite drops and reinstalls
          # migration_control (and drops/recreates public) before every case,
          # so its before() runs the same database-identity guard as
          # test:pg:migration — which must see both URLs to prove they name
          # different physical databases. Supplying only the migration
          # credential makes every case fail in before/setup.
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_execution_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        # The counts are asserted, not merely the exit status: a suite that
        # dies in before(), or silently skips, must fail this step rather than
        # quietly removing its own coverage.
        run: |
          set -o pipefail
          npm run test:pg:supervision --prefix backend 2>&1 | tee /tmp/pg-supervision.log
          grep -qx '# pass 6' /tmp/pg-supervision.log
          grep -qx '# fail 0' /tmp/pg-supervision.log
          grep -qx '# skipped 0' /tmp/pg-supervision.log
      - name: Test whole-migration wall-clock supervision against real PostgreSQL
        env:
          # Both credentials, deliberately: like test:pg:migration, this
          # suite installs and drops migration_control every case, so it
          # requires the same distinct-database safety proof before any
          # destructive statement runs.
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_execution_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        run: npm run test:pg:wallclock --prefix backend
      - name: Test batched-mode wall-clock supervision against real PostgreSQL
        env:
          # Both credentials, deliberately: like test:pg:wallclock, this
          # suite installs and drops migration_control every case, so it
          # requires the same distinct-database safety proof before any
          # destructive statement runs.
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_execution_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        run: npm run test:pg:batched --prefix backend
      - name: Test ambiguous post-COMMIT connection failure against real PostgreSQL
        env:
          # Both credentials, deliberately: like test:pg:migration, this
          # suite installs and drops migration_control every case, so it
          # requires the same distinct-database safety proof before any
          # destructive statement runs.
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_execution_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
          # The explicit-password credential-preservation regression only runs
          # when this is supplied, and it needs a role whose pg_hba.conf rule
          # genuinely enforces password authentication — otherwise a dropped
          # password would silently "work" under trust auth and the case would
          # prove nothing. This service container sets POSTGRES_PASSWORD and
          # leaves POSTGRES_HOST_AUTH_METHOD unset, so every host (TCP)
          # connection is scram-sha-256 authenticated; the test itself proves
          # that by asserting a password-stripped connect is rejected.
          PB10_PASSWORD_AUTH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_execution_test
        # Zero skips asserted explicitly: a missing/renamed variable would
        # otherwise silently downgrade the password-authentication regression
        # to a skip while the step still went green.
        run: |
          set -o pipefail
          npm run test:pg:commit-ambiguity --prefix backend 2>&1 | tee /tmp/pg-commit-ambiguity.log
          grep -qx '# fail 0' /tmp/pg-commit-ambiguity.log
          grep -qx '# skipped 0' /tmp/pg-commit-ambiguity.log
          grep -q 'explicit host/user/password credentials' /tmp/pg-commit-ambiguity.log
      - name: Test application/migration database identity guard
        env:
          # Both credentials, deliberately: this suite's entire purpose is to
          # prove they resolve to different physical databases.
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migration_execution_test
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        run: npm run test:pg:identity --prefix backend
      - name: Prove the application database survived destructive migration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        run: |
          test "$(psql "$TEST_DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "select to_regclass('public.tenants') is not null and to_regclass('public.users') is not null")" = "t"
      - name: Run commercial database tests against the untouched application database
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/application_test
        run: npm run test:pg:commercial --prefix backend
      - name: Delete isolated test databases
        if: always()
        run: |
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop database if exists migration_execution_test with (force)"
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "drop database if exists application_test with (force)"

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
      - run: terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform/bootstrap init -backend=false
      - run: terraform -chdir=terraform/bootstrap validate
      - run: bash -n infra/scripts/*.sh
      - run: infra/scripts/static-infra-check.sh
      - run: docker build -f backend/Dockerfile -t submitsense-backend:ci .
      - run: docker run --rm submitsense-backend:ci sh -c 'test -f dist/main.js && test -f dist/worker/worker.js && test -f dist/worker-pools.json && test -f dist/ops/check-db-capacity.js && ! test -e node_modules/typescript && ! test -e node_modules/.bin/tsx'
      - run: docker build -f backend/Dockerfile.migrations -t submitsense-migrations:ci .
      - run: docker build -f web/Dockerfile -t submitsense-frontend:ci .
